; Tableau de bord multi-imprimantes Bambu Lab - M5Stack Tab5 (ESP32-P4)
; Le P4 demande la plateforme pioarduino (Arduino core 3.x), pas la plateforme espressif32 officielle.
; Archive "stable" : à figer sur une version précise une fois le build validé (voir docs/DECISIONS.md, D-009).

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_upload.flash_size = 16MB
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=3

lib_deps =
  https://github.com/M5Stack/M5Unified.git
  https://github.com/M5Stack/M5GFX.git
