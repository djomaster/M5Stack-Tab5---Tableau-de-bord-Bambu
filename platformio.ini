; Tableau de bord multi-imprimantes Bambu Lab - M5Stack Tab5 (ESP32-P4)
; Le P4 demande la plateforme pioarduino (Arduino core 3.x), pas la plateforme espressif32 officielle.
; Version figée (D-010) : l'archive "stable" avance et exige un PlatformIO Core plus récent (voir CHANGELOG 0.1.2).

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_upload.flash_size = 16MB
; Table de partitions 16 Mo (application jusqu'à 6,5 Mo) : la table par défaut (1,25 Mo) est trop petite depuis la 0.3.0
board_build.partitions = default_16MB.csv
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Exclut les fichiers assembleur ARM de LVGL, incompatibles avec le RISC-V du P4 (CHANGELOG 0.2.0)
extra_scripts =
  pre:tools/skip_lvgl_asm.py
  post:tools/merge_bin.py

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_LOOP_STACK_SIZE=16384
  ; LVGL 9 sans fichier lv_conf.h : les options sont passées ici (voir docs/DECISIONS.md, D-013)
  -DLV_CONF_SKIP=1
  -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CUSTOM
  -DLV_USE_STDLIB_STRING=LV_STDLIB_CLIB
  -DLV_USE_STDLIB_SPRINTF=LV_STDLIB_CLIB
  -DLV_USE_DRAW_SW_ASM=0
  -DLV_USE_TINY_TTF=1
  -DLV_TINY_TTF_FILE_SUPPORT=0

lib_deps =
  https://github.com/M5Stack/M5Unified.git
  https://github.com/M5Stack/M5GFX.git
  lvgl/lvgl@9.2.2
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.0
